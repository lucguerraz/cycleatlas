services:
  app:
    image: ghcr.io/lucguerraz/cycleatlas:latest
    restart: unless-stopped
    pull_policy: always
    networks:
      - coolify
    environment:
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?}
      - NUXT_MONGOOSE_URI=${NUXT_MONGOOSE_URI:?}
      - NUXT_REDIS_URL=${NUXT_REDIS_URL:?}
      - NUXT_AUTH_HOST=${NUXT_AUTH_HOST:?}
      - NUXT_AUTH_ALLOWLIST=${NUXT_AUTH_ALLOWLIST}
      - NUXT_AUTH_SIGNING_SECRET=${NUXT_AUTH_SIGNING_SECRET:?}
      - NUXT_RESEND_APIKEY=${NUXT_RESEND_APIKEY:?}
      - NUXT_RESEND_FROM=${NUXT_RESEND_FROM:?}
  worker:
    image: ghcr.io/lucguerraz/cycleatlas:latest
    restart: unless-stopped
    pull_policy: always
    networks:
      - coolify
    environment:
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?}
      - NUXT_MONGOOSE_URI=${NUXT_MONGOOSE_URI:?}
      - NUXT_REDIS_URL=${NUXT_REDIS_URL:?}
      - NUXT_AUTH_HOST=${NUXT_AUTH_HOST:?}
      - NUXT_AUTH_ALLOWLIST=${NUXT_AUTH_ALLOWLIST}
      - NUXT_AUTH_SIGNING_SECRET=${NUXT_AUTH_SIGNING_SECRET:?}
      - NUXT_RESEND_APIKEY=${NUXT_RESEND_APIKEY:?}
      - NUXT_RESEND_FROM=${NUXT_RESEND_FROM:?}
    command: ["node", "/app/server/workers/index.mjs"]

networks:
  coolify:
    external: true