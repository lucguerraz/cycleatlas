services:
  app:
    image: ghcr.io/lucguerraz/cycleatlas:latest
    networks:
      - coolify
    environment:
      - NUXT_OAUTH_STRAVA_CLIENT_ID=${NUXT_OAUTH_STRAVA_CLIENT_ID:?}
      - NUXT_OAUTH_STRAVA_CLIENT_SECRET=${NUXT_OAUTH_STRAVA_CLIENT_SECRET:?}
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?}
      - NUXT_MONGOOSE_URI=${NUXT_MONGOOSE_URI:?}
      - NUXT_REDIS_URL=${NUXT_REDIS_URL:?}
      - NUXT_STRAVA_WEBHOOK_VERIFY_TOKEN=${NUXT_STRAVA_WEBHOOK_VERIFY_TOKEN:?}
      - NUXT_STRAVA_WEBHOOK_SIGNING_SECRET=${NUXT_STRAVA_WEBHOOK_SIGNING_SECRET:?}
      - NUXT_STRAVA_WEBHOOK_SUBSCRIPTION_ID=${NUXT_STRAVA_WEBHOOK_SUBSCRIPTION_ID:?}
  worker:
    image: ghcr.io/lucguerraz/cycleatlas:latest
    networks:
      - coolify
    environment:
      - NUXT_OAUTH_STRAVA_CLIENT_ID=${NUXT_OAUTH_STRAVA_CLIENT_ID:?}
      - NUXT_OAUTH_STRAVA_CLIENT_SECRET=${NUXT_OAUTH_STRAVA_CLIENT_SECRET:?}
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?}
      - NUXT_MONGOOSE_URI=${NUXT_MONGOOSE_URI:?}
      - NUXT_REDIS_URL=${NUXT_REDIS_URL:?}
      - NUXT_STRAVA_WEBHOOK_VERIFY_TOKEN=${NUXT_STRAVA_WEBHOOK_VERIFY_TOKEN:?}
      - NUXT_STRAVA_WEBHOOK_SIGNING_SECRET=${NUXT_STRAVA_WEBHOOK_SIGNING_SECRET:?}
      - NUXT_STRAVA_WEBHOOK_SUBSCRIPTION_ID=${NUXT_STRAVA_WEBHOOK_SUBSCRIPTION_ID:?}
    command: ["node", "/app/server/workers/index.mjs"]

networks:
  coolify:
    external: true